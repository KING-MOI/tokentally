[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentally"
version = "0.4.0.dev0"
description = "Token usage and cost reports for Claude Code, Codex and Gemini CLI logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Verma" }]
requires-python = ">=3.11"
keywords = ["claude", "codex", "gemini", "tokens", "llm", "cost", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/OWNER/tokentally"
Issues = "https://github.com/OWNER/tokentally/issues"
Changelog = "https://github.com/OWNER/tokentally/blob/main/CHANGELOG.md"

[project.scripts]
tokentally = "tokentally.__main__:run"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.17.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tokentally"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tokentally"]
known-local-folder = ["conftest"]

[tool.mypy]
strict = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokentally = ["py.typed"]
