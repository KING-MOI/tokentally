[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentally"
version = "0.1.0.dev0"
description = "Token usage and cost reports for Claude Code, Codex and Gemini CLI logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Verma" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tokentally = "tokentally.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
