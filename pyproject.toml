[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentally"
version = "0.1.0.dev0"
description = "Token usage and cost reports for Claude Code, Codex and Gemini CLI logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Verma" }]
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.scripts]
tokentally = "tokentally.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tokentally"]
known-local-folder = ["conftest"]

[tool.setuptools.packages.find]
where = ["src"]
